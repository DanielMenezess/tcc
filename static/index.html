<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Fade House | Gestão</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="cabecalho">
    <div class="marca">
      <h1>Fade House</h1>
      <p>Sistema de agendamentos</p>
    </div>
    <nav class="navegacao" role="tablist" aria-label="Seções principais">
      <button class="link-nav ativo" id="tab-servicos" type="button" role="tab" aria-selected="true" aria-controls="aba-servicos" tabindex="0">Serviços</button>
      <button class="link-nav" id="tab-cliente" type="button" role="tab" aria-selected="false" aria-controls="aba-cliente" tabindex="-1">Cadastro de cliente</button>
    </nav>
  </header>

  <main class="conteudo">
    <section class="visao" id="aba-servicos" role="tabpanel" aria-labelledby="tab-servicos" tabindex="0">
      <section class="painel" aria-labelledby="titulo-servicos">
        <div class="cabecalho-painel">
          <h2 id="titulo-servicos">Serviços</h2>
          <span id="total-servicos" class="contador" aria-live="polite"></span>
        </div>
        <ul id="lista-servicos" class="lista-servicos" aria-live="polite">
          <li class="estado-lista">Carregando serviços...</li>
        </ul>
      </section>

      <section class="painel painel-formulario" aria-labelledby="titulo-adicionar">
        <h2 id="titulo-adicionar">Adicionar serviço</h2>
        <form id="form-servico">
          <div class="campos-formulario">
            <div class="campo campo-nome">
              <label for="nome">Nome</label>
              <input id="nome" name="nome" type="text" placeholder="Ex.: Barboterapia" maxlength="80" required>
              <span class="erro" data-erro="nome"></span>
            </div>
            <div class="campo">
              <label for="duracao">Duração (min)</label>
              <input id="duracao" name="duracao" type="number" min="5" max="480" step="5" placeholder="30" required>
              <span class="erro" data-erro="duracao"></span>
            </div>
            <div class="campo campo-preco">
              <label for="preco">Preço (R$)</label>
              <input id="preco" name="preco" type="number" min="0" max="99999.99" step="0.01" placeholder="40,00" required>
              <span class="erro" data-erro="preco"></span>
            </div>
          </div>
          <p id="mensagem" class="mensagem" aria-live="polite"></p>
          <button id="adicionar" class="botao-principal" type="submit">Adicionar</button>
        </form>
      </section>
    </section>

    <section class="visao" id="aba-cliente" role="tabpanel" aria-labelledby="tab-cliente" tabindex="0" hidden>
      <section class="painel painel-formulario" aria-labelledby="titulo-cadastro-cliente">
        <h2 id="titulo-cadastro-cliente">Cadastro de cliente</h2>
        <form id="form-cliente">
          <div class="campos-formulario">
            <div class="campo campo-completo">
              <label for="cliente-nome">Nome completo</label>
              <input id="cliente-nome" name="nome" type="text" autocomplete="name" placeholder="Ex.: Maria da Silva" minlength="3" required>
              <span class="erro" data-erro="nome"></span>
            </div>
            <div class="campo">
              <label for="cliente-telefone">Número de telefone</label>
              <input id="cliente-telefone" name="telefone" type="tel" autocomplete="tel" inputmode="tel" placeholder="(41) 99999-9999" required>
              <span class="erro" data-erro="telefone"></span>
            </div>
            <div class="campo">
              <label for="cliente-email">E-mail</label>
              <input id="cliente-email" name="email" type="email" autocomplete="email" placeholder="nome@exemplo.com" required>
              <span class="erro" data-erro="email"></span>
            </div>
          </div>
          <p id="mensagem-cliente" class="mensagem" aria-live="polite"></p>
          <button id="cadastrar-cliente" class="botao-principal" type="submit">Cadastrar cliente</button>
        </form>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
