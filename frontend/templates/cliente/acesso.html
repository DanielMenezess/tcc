    <section id="tela-cadastro" class="painel painel-formulario" aria-labelledby="titulo-cadastro" hidden>
      <button id="voltar-apresentacao-cadastro" class="botao-sair botao-voltar-apresentacao" type="button">Voltar</button>
      <h2 id="titulo-cadastro">Crie seu cadastro</h2>
      <p class="texto-introdutorio">Informe seus dados para criar uma conta de cliente.</p>
      <form id="form-cadastro">
        <div class="campos-formulario">
          <div class="campo campo-completo">
            <label for="cadastro-nome">Nome completo</label>
            <input id="cadastro-nome" name="nome" type="text" autocomplete="name" placeholder="Ex.: Maria da Silva" minlength="3" required>
            <span class="erro" data-erro="nome"></span>
          </div>
          <div class="campo">
            <label for="cadastro-telefone">Número de telefone</label>
            <input id="cadastro-telefone" name="telefone" type="tel" autocomplete="tel" inputmode="numeric" maxlength="15" placeholder="(41) 99999-9999" required>
            <span class="erro" data-erro="telefone"></span>
          </div>
          <div class="campo">
            <label for="cadastro-email">E-mail</label>
            <input id="cadastro-email" name="email" type="email" autocomplete="email" placeholder="nome@exemplo.com" required>
            <span class="erro" data-erro="email"></span>
          </div>
          <div class="campo campo-completo">
            <label for="cadastro-senha">Senha</label>
            <input id="cadastro-senha" name="senha" type="password" autocomplete="new-password" minlength="6" maxlength="128" required>
            <span class="erro" data-erro="senha"></span>
          </div>
          <div class="campo campo-completo">
            <label for="cadastro-confirmar-senha">Confirme sua senha</label>
            <input id="cadastro-confirmar-senha" name="confirmar_senha" type="password" autocomplete="new-password" minlength="6" maxlength="128" required>
            <span class="erro" data-erro="confirmar_senha"></span>
          </div>
        </div>
        <p id="mensagem-cadastro" class="mensagem" aria-live="polite"></p>
        <button id="botao-cadastro" class="botao-principal" type="submit">Criar conta</button>
      </form>
      <p class="alternativa-acesso">Já tem cadastro? <button id="abrir-login" class="link-alternativo" type="button">Entrar</button></p>
    </section>

    <section id="tela-login" class="painel painel-formulario" aria-labelledby="titulo-login" hidden>
      <button id="voltar-apresentacao-login" class="botao-sair botao-voltar-apresentacao" type="button">Voltar</button>
      <h2 id="titulo-login">Acesse sua conta</h2>
      <p class="texto-introdutorio">Entre com os dados usados no cadastro.</p>
      <form id="form-login">
        <div class="campos-formulario">
          <div class="campo campo-completo">
            <label for="login-identificador">E-mail ou telefone</label>
            <input id="login-identificador" name="identificador" type="text" autocomplete="username" autocapitalize="none" placeholder="nome@exemplo.com ou (41) 99999-9999" required>
          </div>
          <div class="campo campo-completo">
            <label for="login-senha">Senha</label>
            <input id="login-senha" name="senha" type="password" autocomplete="current-password" required>
          </div>
        </div>
        <p id="mensagem-login" class="mensagem" aria-live="polite"></p>
        <button id="botao-login" class="botao-principal" type="submit">Entrar</button>
      </form>
      <p class="alternativa-acesso">Ainda não tem cadastro? <button id="abrir-cadastro" class="link-alternativo" type="button">Cadastrar-se</button></p>
    </section>
