      <section id="painel-contas-administrador" class="painel" aria-labelledby="titulo-contas-administrador" hidden>
        <h2 id="titulo-contas-administrador">Contas cadastradas</h2>
        <p id="mensagem-contas-administrador" class="mensagem" aria-live="polite"></p>
        <form id="form-conta-administrador">
          <div class="campos-formulario">
            <div class="campo campo-completo">
              <label for="tipo-conta-administrador">Tipo de conta</label>
              <select id="tipo-conta-administrador" name="tipo" required>
                <option value="clientes">Cliente</option>
                <option value="barbeiros">Barbeiro</option>
              </select>
            </div>
            <div class="campo campo-completo">
              <label for="nome-conta-administrador">Nome completo</label>
              <input id="nome-conta-administrador" name="nome" type="text" autocomplete="name" required>
              <span class="erro" data-erro="nome"></span>
            </div>
            <div class="campo">
              <label for="telefone-conta-administrador">Número de telefone</label>
              <input id="telefone-conta-administrador" name="telefone" type="tel" autocomplete="tel" inputmode="numeric" maxlength="15" placeholder="(41) 99999-9999" required>
              <span class="erro" data-erro="telefone"></span>
            </div>
            <div class="campo">
              <label for="email-conta-administrador">E-mail</label>
              <input id="email-conta-administrador" name="email" type="email" autocomplete="email" required>
              <span class="erro" data-erro="email"></span>
            </div>
            <div class="campo campo-completo">
              <label for="senha-conta-administrador">Senha</label>
              <input id="senha-conta-administrador" name="senha" type="password" autocomplete="new-password" minlength="6" maxlength="128" required>
              <span class="erro" data-erro="senha"></span>
            </div>
          </div>
          <button id="botao-criar-conta" class="botao-principal" type="submit">Cadastrar conta</button>
        </form>
        <div class="abas-contas" role="tablist" aria-label="Tipo de conta">
          <button id="aba-contas-clientes" class="aba-conta selecionada" type="button" role="tab" aria-selected="true" aria-controls="grupo-contas-clientes" data-aba-contas="clientes">Clientes</button>
          <button id="aba-contas-barbeiros" class="aba-conta" type="button" role="tab" aria-selected="false" aria-controls="grupo-contas-barbeiros" data-aba-contas="barbeiros" tabindex="-1">Barbeiros</button>
        </div>
        <div class="grupos-contas">
          <div id="grupo-contas-clientes" class="grupo-contas" role="tabpanel" aria-labelledby="aba-contas-clientes" tabindex="0">
            <div class="cabecalho-painel">
              <h3 id="titulo-contas-clientes">Clientes</h3>
              <span id="total-contas-clientes" class="contador" aria-live="polite"></span>
            </div>
            <div class="campo campo-busca-conta">
              <label for="buscar-contas-clientes">Buscar cliente</label>
              <input id="buscar-contas-clientes" type="search" placeholder="Nome, e-mail ou telefone" autocomplete="off">
            </div>
            <ul id="lista-contas-clientes" class="lista-servicos" aria-live="polite">
              <li class="estado-lista">Carregando contas...</li>
            </ul>
          </div>
          <div id="grupo-contas-barbeiros" class="grupo-contas" role="tabpanel" aria-labelledby="aba-contas-barbeiros" tabindex="0" hidden>
            <div class="cabecalho-painel">
              <h3 id="titulo-contas-barbeiros">Barbeiros</h3>
              <span id="total-contas-barbeiros" class="contador" aria-live="polite"></span>
            </div>
            <div class="campo campo-busca-conta">
              <label for="buscar-contas-barbeiros">Buscar barbeiro</label>
              <input id="buscar-contas-barbeiros" type="search" placeholder="Nome, e-mail ou telefone" autocomplete="off">
            </div>
            <ul id="lista-contas-barbeiros" class="lista-servicos" aria-live="polite">
              <li class="estado-lista">Carregando contas...</li>
            </ul>
          </div>
        </div>
      </section>
